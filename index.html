<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="light dark">

<title>Optimus Wallet</title>

<link rel="manifest" href="./manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles.css">

</head>

<body>

<div id="app">


<!-- HEADER -->

<header class="header">

<div>
<p id="greeting" class="eyebrow">
GOOD EVENING
</p>

<h1>
<span id="userName">
there
</span>
</h1>

</div>


<div class="header-actions">

<button id="settingsBtn"
class="icon-button">

⚙

</button>


<button id="optimusBtn"
class="orb-button">

<div class="orb"></div>

</button>


</div>

</header>



<!-- MAIN -->

<main>


<!-- HOME -->

<section id="home"
class="page active">


<div class="hero glass">

<div>

<p class="label">
OPTIMUS RECOMMENDS
</p>


<h2 id="recommendation">
Add your cards to begin optimization.
</h2>


<p id="recommendationReason"
class="muted">

</p>

</div>


</div>



<div class="glass panel">

<div class="panel-header">

<h3>
Upcoming
</h3>

<button data-page="bills">
View all
</button>

</div>


<div id="upcomingBills">

<div class="empty">
No bills added.
</div>

</div>


</div>




<div class="glass panel">

<div class="panel-header">

<h3>
Active Deals
</h3>


<button data-page="deals">
View all
</button>

</div>


<div id="dealPreview">

<div class="empty">
No deals added.
</div>


</div>

</div>



</section>





<!-- WALLET -->

<section id="wallet"
class="page">


<div class="page-title">

<h2>
Wallet
</h2>

<button id="addCard">
+
</button>

</div>



<div id="cardsContainer">

<div class="empty">

No cards added.

</div>

</div>



</section>







<!-- ADVISOR -->

<section id="advisor"
class="page">


<div class="page-title">

<h2>
Card Advisor
</h2>

</div>


<div class="category-grid"
id="categoryGrid">

</div>



<div id="advisorResult">

</div>



</section>







<!-- OPTIMUS -->

<section id="optimus"
class="page">


<div class="optimus-center">


<div class="large-orb">

</div>


<p id="optimusStatus">

STANDING BY

</p>


</div>



<div id="chat">

<div class="message assistant">

I’m ready. Ask me about your cards, bills, or spending.

</div>


</div>



<div class="chat-input">


<input
id="chatInput"
placeholder="Ask Optimus...">


<button id="sendMessage">

➤

</button>


</div>



</section>







<!-- BILLS -->

<section id="bills"
class="page">


<div class="page-title">

<h2>
Bills
</h2>


<button id="addBill">
+
</button>

</div>



<div id="billsContainer">

<div class="empty">

No bills tracked.

</div>


</div>



</section>







<!-- DEALS -->

<section id="deals"
class="page">


<div class="page-title">

<h2>
Deals
</h2>


<button id="addDeal">
+
</button>


</div>


<div id="dealsContainer">

<div class="empty">

No deals saved.

</div>


</div>


</section>



</main>







<!-- NAVIGATION -->


<nav class="navigation">


<button data-page="home"
class="nav-item active">

⌂

<span>
Home
</span>

</button>



<button data-page="wallet"
class="nav-item">

▣

<span>
Wallet
</span>

</button>



<button data-page="advisor"
class="nav-item">

◎

<span>
Advisor
</span>

</button>



<button data-page="bills"
class="nav-item">

▤

<span>
Bills
</span>

</button>



<button data-page="optimus"
class="nav-item optimus-nav">

◉

<span>
Optimus
</span>

</button>



</nav>





<!-- MODAL -->


<div id="modal"
class="modal hidden">


<div class="modal-content glass">

<button id="closeModal"
class="close">

×


</button>


<div id="modalBody">

</div>


</div>


</div>



</div>


<script src="./app.js"></script>


</body>
</html>
