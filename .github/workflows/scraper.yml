name: Auto-Scrape Deals

on:
  # This schedule tells GitHub to run the script automatically
  schedule:
    - cron: '0 12 * * *' # Runs every day at 12:00 PM UTC
  
  # This allows you to manually click a "Run" button to test it instantly
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Engine
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Required Packages
        run: npm install @supabase/supabase-js rss-parser

      - name: Run the Scraper Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scraper.js
